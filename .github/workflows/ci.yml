name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven

    - name: Build and test
      run: ./mvnw verify -B

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco/index.html
        retention-days: 7

    - name: Docker build
      run: |
        docker build -t nabat-app:${{ github.sha }} .
        docker tag nabat-app:${{ github.sha }} nabat-app:latest

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3
      with:
        dockerfile: Dockerfile

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven

    - name: Checkstyle
      run: ./mvnw checkstyle:check -B
