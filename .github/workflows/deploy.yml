name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: latest

    - name: Configure kubectl
      uses: azure/setup-kubectl@v4

    - name: Set KUBECONFIG
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

    - name: Deploy with Helm
      run: |
        helm upgrade --install nabat ./helm/nabat \
          --set nabatApp.image=nabat-app:${{ github.sha }} \
          --set votingApp.image=nabat-voting-app:${{ github.sha }} \
          --atomic \
          --timeout 5m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/nabat-app -n nabat --timeout=3m
        kubectl rollout status deployment/nabat-voting-app -n nabat --timeout=3m
        kubectl get pods -n nabat
