apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-zipkin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/component: zipkin
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: zipkin
        image: {{ .Values.monitoring.zipkin.image }}
        env:
        # Stated, not inherited. `mem` is an in-process ring buffer: traces are lost on
        # restart and bounded by heap, which is the right trade for a learning cluster and
        # the wrong one to discover by accident. Durable tracing means STORAGE_TYPE
        # elasticsearch (or cassandra) plus that backend — a deliberate step, not a default.
        - name: STORAGE_TYPE
          value: mem
        ports:
        - containerPort: 9411
        # Zipkin answers /health once the collector and storage are up. Without a readiness
        # probe the Service starts routing span POSTs at container start, and the exporter
        # in each application treats the refusal as a dropped trace.
        readinessProbe:
          httpGet:
            path: /health
            port: 9411
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9411
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-zipkin
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: zipkin
  ports:
  - port: 9411
  type: NodePort
