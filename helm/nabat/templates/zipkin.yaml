apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-zipkin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/component: zipkin
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: zipkin
        image: {{ .Values.monitoring.zipkin.image }}
        ports:
        - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-zipkin
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: zipkin
  ports:
  - port: 9411
  type: NodePort
