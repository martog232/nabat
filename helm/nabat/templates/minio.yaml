{{- if eq .Values.nabatApp.storage.type "s3" }}
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nabat.fullname" . }}-minio
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-minio
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so a rolling update would leave two pods contending for one
  # volume and the new one stuck Pending. Recreate accepts a moment of downtime instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: minio
        image: {{ .Values.minio.image }}
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: minio-access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: minio-secret-key
        ports:
        - containerPort: 9000
          name: s3
        - containerPort: 9001
          name: console
        # /minio/health/live answers before the object layer is usable, so it is right for
        # liveness and wrong for readiness — hence the two different paths.
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.minio.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "nabat.fullname" . }}-minio
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-minio
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: minio
  ports:
  - port: 9000
    targetPort: 9000
    name: s3
  - port: 9001
    targetPort: 9001
    name: console
---
# Creates the bucket. Deliberately not the application's job: a service that creates its
# own bucket will just as happily create one from a typo and write into it, and the mistake
# only surfaces as photos that vanished.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nabat.fullname" . }}-minio-init
  namespace: {{ .Values.namespace }}
  annotations:
    # Runs on install and upgrade, after MinIO exists. before-hook-creation lets a repeat
    # upgrade replace the previous Job, which is otherwise immutable and fails the release.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: {{ .Values.minio.clientImage }}
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: minio-access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: minio-secret-key
        command:
        - /bin/sh
        - -c
        - |
          set -e
          # The Job may start before MinIO is serving; retry rather than fail the release.
          until mc alias set nabat http://{{ include "nabat.fullname" . }}-minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
            echo "waiting for minio..."
            sleep 3
          done
          mc mb --ignore-existing nabat/{{ .Values.nabatApp.storage.bucket }}
          echo "bucket {{ .Values.nabatApp.storage.bucket }} ready"
{{- end }}
{{- end }}
