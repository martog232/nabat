apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nabat.fullname" . }}-promtail-config
  namespace: {{ .Values.namespace }}
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/positions.yaml
    clients:
    - url: http://{{ include "nabat.fullname" . }}-loki:3100/loki/api/v1/push
    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: keep
        regex: nabat-app|voting-app|postgres|kafka|redis
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nabat.fullname" . }}-promtail
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/component: promtail
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nabat.fullname" . }}-promtail
      containers:
      - name: promtail
        image: {{ .Values.monitoring.promtail.image }}
        args:
        - -config.file=/etc/promtail/promtail.yml
        volumeMounts:
        - mountPath: /etc/promtail
          name: config
        - mountPath: /var/log
          name: varlog
        - mountPath: /var/lib/docker/containers
          name: docker-containers
          readOnly: true
        - mountPath: /run
          name: run
      volumes:
      - name: config
        configMap:
          name: {{ include "nabat.fullname" . }}-promtail-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: docker-containers
        hostPath:
          path: /var/lib/docker/containers
      - name: run
        hostPath:
          path: /run
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nabat.fullname" . }}-promtail
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nabat.fullname" . }}-promtail
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nabat.fullname" . }}-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nabat.fullname" . }}-promtail
subjects:
- kind: ServiceAccount
  name: {{ include "nabat.fullname" . }}-promtail
  namespace: {{ .Values.namespace }}
