apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nabat.fullname" . }}-grafana-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Datasources are provisioned from the ConfigMap below and survive without this, but
      # anything a person builds in the UI — a dashboard, an explore query, a preference —
      # lived in an emptyDir and died with the pod.
      storage: {{ .Values.monitoring.grafana.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nabat.fullname" . }}-grafana-dashboard-provider
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  nabat.yml: |
{{ .Files.Get "grafana/dashboards.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nabat.fullname" . }}-grafana-dashboards
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  # Globbed rather than listed: adding a dashboard file should not also require editing a
  # template, or the second dashboard never gets committed as code.
  {{- range $path, $bytes := .Files.Glob "grafana/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nabat.fullname" . }}-grafana-datasources
  namespace: {{ .Values.namespace }}
data:
  datasources.yml: |
    apiVersion: 1
    # Deleted by name before the definitions below are applied. Grafana keys a provisioned
    # datasource by uid, so on a PVC that still holds datasources provisioned before these
    # uids existed, it tries to update a uid that is not there and the whole service fails
    # to start — not just the datasource. This keeps the file idempotent against an
    # existing volume.
    deleteDatasources:
    - name: Prometheus
      orgId: 1
    - name: Loki
      orgId: 1
    - name: Zipkin
      orgId: 1
    datasources:
    - name: Prometheus
      type: prometheus
      # Stable uid: provisioned dashboards reference it, and a generated one differs per
      # install, so the dashboards would point at nothing.
      uid: prometheus
      access: proxy
      url: http://{{ include "nabat.fullname" . }}-prometheus:9090
      isDefault: true
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://{{ include "nabat.fullname" . }}-loki:3100
    - name: Zipkin
      type: zipkin
      uid: zipkin
      access: proxy
      url: http://{{ include "nabat.fullname" . }}-zipkin:9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-grafana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
  # Recreate: ReadWriteOnce PVC, so the outgoing pod must release it first.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: grafana
        image: {{ .Values.monitoring.grafana.image }}
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.monitoring.grafana.adminPassword }}
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        ports:
        - containerPort: 3000
        volumeMounts:
        - mountPath: /etc/grafana/provisioning/datasources
          name: datasources
        - mountPath: /etc/grafana/provisioning/dashboards
          name: dashboard-provider
        - mountPath: /var/lib/grafana/dashboards
          name: dashboards
        - mountPath: /var/lib/grafana
          name: storage
      volumes:
      - name: datasources
        configMap:
          name: {{ include "nabat.fullname" . }}-grafana-datasources
      - name: dashboard-provider
        configMap:
          name: {{ include "nabat.fullname" . }}-grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: {{ include "nabat.fullname" . }}-grafana-dashboards
      - name: storage
        persistentVolumeClaim:
          claimName: {{ include "nabat.fullname" . }}-grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-grafana
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: grafana
  ports:
  - port: 3000
  type: NodePort
