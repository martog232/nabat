apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-schema-registry
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/component: schema-registry
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: schema-registry
        image: {{ .Values.schemaRegistry.image }}
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: {{ include "nabat.fullname" . }}-schema-registry
        - name: SCHEMA_REGISTRY_LISTENERS
          value: http://0.0.0.0:8085
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: PLAINTEXT://{{ include "nabat.fullname" . }}-kafka:9092
        # The registry keeps its schemas in a Kafka topic, single-replica like everything
        # else on this one-broker cluster.
        - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
          value: "1"
        # BACKWARD: a new schema must read data written with the old one. That is the
        # direction this system needs — nabat-app replays vote.changed from the beginning to
        # rebuild its counts, so it meets messages written by older producers by design.
        - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
          value: {{ .Values.schemaRegistry.compatibility | quote }}
        ports:
        - containerPort: 8085
        # Slow to start: it will not serve until its Kafka-backed store is readable, so the
        # startup probe is generous and the liveness probe only takes over afterwards.
        startupProbe:
          httpGet:
            path: /subjects
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /subjects
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-schema-registry
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: schema-registry
  ports:
  - name: http
    port: 8085
