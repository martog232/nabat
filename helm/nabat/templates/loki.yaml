apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nabat.fullname" . }}-loki-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # As with Prometheus: monitoring.loki.storage was configured and unused, so logs
      # lived only as long as the pod that received them.
      storage: {{ .Values.monitoring.loki.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: loki
  # Recreate: the ReadWriteOnce PVC cannot be mounted by a new pod while the outgoing
  # one holds it, which is a deadlock rather than a slow rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loki
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: loki
        image: {{ .Values.monitoring.loki.image }}
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - containerPort: 3100
        volumeMounts:
        - mountPath: /loki
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: {{ include "nabat.fullname" . }}-loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-loki
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: loki
  ports:
  - port: 3100
