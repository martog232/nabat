apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loki
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: loki
        image: {{ .Values.monitoring.loki.image }}
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - containerPort: 3100
        volumeMounts:
        - mountPath: /loki
          name: storage
      volumes:
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-loki
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: loki
  ports:
  - port: 3100
