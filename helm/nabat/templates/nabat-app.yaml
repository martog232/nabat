apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nabat.fullname" . }}-uploads
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nabatApp.uploadsStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: nabat-app
spec:
  replicas: {{ .Values.nabatApp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: nabat-app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nabat-app
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      {{- include "nabat.imagePullSecrets" . | nindent 6 }}
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z {{ include "nabat.fullname" . }}-postgres 5432; do
            echo "waiting for postgres..."
            sleep 2
          done
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z {{ include "nabat.fullname" . }}-redis 6379; do
            echo "waiting for redis..."
            sleep 2
          done
      containers:
      - name: nabat-app
        image: {{ .Values.nabatApp.image }}
        imagePullPolicy: {{ .Values.nabatApp.imagePullPolicy }}
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://{{ include "nabat.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
        - name: SPRING_DATASOURCE_USERNAME
          value: {{ .Values.postgres.user }}
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: postgres-password
        - name: SPRING_DATA_REDIS_HOST
          value: {{ include "nabat.fullname" . }}-redis
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: jwt-secret
        - name: MAIL_HOST
          value: {{ .Values.nabatApp.mailHost }}
        - name: MAIL_PORT
          value: "{{ .Values.nabatApp.mailPort }}"
        - name: NABAT_BASE_URL
          # Derived from the ingress host unless explicitly overridden, so the links in
          # verification emails point at the address a browser can actually reach.
          value: {{ .Values.nabatApp.baseUrl | default (printf "http://%s" .Values.ingress.host) | quote }}
        - name: NABAT_VOTING_SERVICE_BASE_URL
          value: {{ .Values.nabatApp.votingServiceUrl }}
        # JSON logs so Promtail ships structured fields to Loki and traceId is queryable
        # in Grafana instead of being text inside a message.
        - name: NABAT_LOG_FORMAT
          value: {{ .Values.nabatApp.logFormat | quote }}
        - name: NABAT_ENVIRONMENT
          value: {{ .Values.nabatApp.environment | quote }}
        ports:
        - containerPort: {{ .Values.nabatApp.port }}
        resources:
          {{- toYaml .Values.nabatApp.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /app/uploads
          name: uploads-storage
        # Startup and liveness ask "is this process alive", so they use the liveness group,
        # which carries no external dependency. They pointed at the aggregate /actuator/health,
        # which meant a Postgres outage read as "this pod is dead" and Kubernetes restarted
        # it in a loop — a restart does not repair a database, and it throws away whatever
        # the pod was still serving.
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.nabatApp.port }}
          {{- toYaml .Values.nabatApp.probes.startup | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {{ .Values.nabatApp.port }}
          {{- toYaml .Values.nabatApp.probes.liveness | nindent 10 }}
        # Readiness was missing entirely, so a pod joined the Service the moment its
        # container started — before Flyway had migrated and before the context was up —
        # and requests routed to it failed. It asks a different question than liveness:
        # not "restart me" but "stop sending me traffic until I can serve it".
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {{ .Values.nabatApp.port }}
          {{- toYaml .Values.nabatApp.probes.readiness | nindent 10 }}
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: {{ include "nabat.fullname" . }}-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: nabat-app
  ports:
  - port: {{ .Values.nabatApp.port }}
  type: NodePort
