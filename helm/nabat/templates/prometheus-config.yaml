apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nabat.fullname" . }}-prometheus-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # monitoring.prometheus.storage used to be set here and read by nothing — the
      # deployment mounted an emptyDir, so every metric vanished with the pod and the
      # value in values.yaml documented durability the chart did not provide.
      storage: {{ .Values.monitoring.prometheus.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nabat.fullname" . }}-prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      # Stated, not defaulted: rule evaluation and Alertmanager's resolve_timeout have to
      # be reasoned about together, and a default that is invisible here cannot be.
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - {{ include "nabat.fullname" . }}-alertmanager:9093
    rule_files:
    - /etc/prometheus/rules/rules.yml
    scrape_configs:
    # metrics_path matters: Spring Boot serves Micrometer at /actuator/prometheus. Without
    # it Prometheus scrapes the default /metrics and gets a 404 from both apps on every
    # single scrape — which is what this chart did, so nothing was ever collected.
    - job_name: nabat-app
      metrics_path: /actuator/prometheus
      static_configs:
      - targets:
        - {{ include "nabat.fullname" . }}-app:{{ .Values.nabatApp.port }}
    - job_name: nabat-voting
      metrics_path: /actuator/prometheus
      static_configs:
      - targets:
        - {{ include "nabat.fullname" . }}-voting-app:{{ .Values.votingApp.port }}
    {{- if .Values.kong.enabled }}
    # Kong's status listener, not its Admin API. Both serve /metrics; only one of them can
    # also replace the gateway's entire configuration via POST /config.
    - job_name: kong-gateway
      metrics_path: /metrics
      static_configs:
      - targets:
        - {{ include "nabat.fullname" . }}-kong:{{ .Values.kong.statusPort }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
  # Recreate, not RollingUpdate: the PVC below is ReadWriteOnce, so a replacement pod
  # cannot mount it while the outgoing one still holds it. The default strategy waits for
  # a volume that will not be released until it stops waiting.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Rolls the pod when the shared rules file changes. Prometheus reads rule files at
        # startup and on SIGHUP only, so without this an upgrade that edits rules.yml
        # updates the ConfigMap and leaves the old rules evaluating — the failure mode
        # being an alert you believe you deployed.
        checksum/rules: {{ .Files.Get "prometheus/rules.yml" | sha256sum }}
      labels:
        app.kubernetes.io/component: prometheus
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      containers:
      - name: prometheus
        image: {{ .Values.monitoring.prometheus.image }}
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports:
        - containerPort: 9090
        volumeMounts:
        - mountPath: /etc/prometheus
          name: config
        # Separate mount, not a second key in the same ConfigMap: the rules come from a
        # shared file via .Files.Get, and keeping them apart means a rule change does not
        # rewrite the scrape config.
        - mountPath: /etc/prometheus/rules
          name: rules
        - mountPath: /prometheus
          name: storage
      volumes:
      - name: config
        configMap:
          name: {{ include "nabat.fullname" . }}-prometheus-config
      - name: rules
        configMap:
          name: {{ include "nabat.fullname" . }}-prometheus-rules
      - name: storage
        persistentVolumeClaim:
          claimName: {{ include "nabat.fullname" . }}-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: prometheus
  ports:
  - port: 9090
  type: NodePort
