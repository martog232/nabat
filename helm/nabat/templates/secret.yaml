apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nabat.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  jwt-secret: {{ required "global.jwtSecret is required — pass --set global.jwtSecret=\"$(openssl rand -base64 48)\". Never commit it to values.yaml." .Values.global.jwtSecret | quote }}
  postgres-password: {{ required "postgres.password is required — pass it at install time rather than committing it." .Values.postgres.password | quote }}
{{- if eq .Values.nabatApp.storage.type "s3" }}
  minio-access-key: {{ required "nabatApp.storage.accessKey is required when storage.type is s3." .Values.nabatApp.storage.accessKey | quote }}
  minio-secret-key: {{ required "nabatApp.storage.secretKey is required when storage.type is s3 — pass it at install time rather than committing it." .Values.nabatApp.storage.secretKey | quote }}
{{- end }}
