apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nabat.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  jwt-secret: {{ required "global.jwtSecret is required — pass --set global.jwtSecret=\"$(openssl rand -base64 48)\". Never commit it to values.yaml." .Values.global.jwtSecret | quote }}
  postgres-password: {{ required "postgres.password is required — pass it at install time rather than committing it." .Values.postgres.password | quote }}
