apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nabat.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  jwt-secret: {{ required "global.jwtSecret is required — pass --set global.jwtSecret=\"$(openssl rand -base64 48)\". Never commit it to values.yaml." .Values.global.jwtSecret | quote }}
  postgres-password: {{ required "postgres.password is required — pass it at install time rather than committing it." .Values.postgres.password | quote }}
{{- if eq .Values.nabatApp.storage.type "s3" }}
  s3-access-key: {{ required "nabatApp.storage.accessKey is required when storage.type is s3." .Values.nabatApp.storage.accessKey | quote }}
  s3-secret-key: {{ required "nabatApp.storage.secretKey is required when storage.type is s3 — pass it at install time rather than committing it." .Values.nabatApp.storage.secretKey | quote }}
{{- if .Values.seaweedfs.enabled }}
  s3-admin-access-key: {{ required "seaweedfs.adminAccessKey is required when seaweedfs is enabled." .Values.seaweedfs.adminAccessKey | quote }}
  s3-admin-secret-key: {{ required "seaweedfs.adminSecretKey is required when seaweedfs is enabled — pass it at install time rather than committing it." .Values.seaweedfs.adminSecretKey | quote }}
  s3-config: {{ include "nabat.s3Config" . | quote }}
{{- end }}
{{- end }}
