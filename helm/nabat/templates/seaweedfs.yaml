{{- if eq .Values.nabatApp.storage.type "s3" }}
{{- if .Values.seaweedfs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nabat.fullname" . }}-seaweedfs
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.seaweedfs.storage }}
---
# SeaweedFS in its single-node `mini` mode. It was MinIO until MinIO stopped publishing
# images and removed minio/minio and minio/mc from Docker Hub.
#
# Two identities, from s3-config in the Secret: the application's key reaches its bucket and
# nothing else, and only the bucket Job holds the admin key. SeaweedFS creates a missing
# bucket on the first upload from an admin key, so an application holding it would turn a
# typo in the bucket name into a new bucket; with its own key the typo is an AccessDenied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-seaweedfs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so a rolling update would leave two pods contending for one
  # volume and the new one stuck Pending. Recreate accepts a moment of downtime instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seaweedfs
        {{- include "nabat.labels" . | nindent 8 }}
      annotations:
        # The identities are read once at startup; a changed key has to restart the pod.
        checksum/s3-config: {{ include "nabat.s3Config" . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.seaweedfs.podSecurityContext | nindent 8 }}
      containers:
      - name: seaweedfs
        image: {{ .Values.seaweedfs.image }}
        securityContext:
          {{- include "nabat.containerSecurityContext" . | nindent 10 }}
        # `-ip=127.0.0.1`: `mini` registers its parts with each other by IP and keeps that on
        # the volume, and the default is the pod's address, which a new pod does not have.
        args:
        - mini
        - -dir=/data
        - -ip=127.0.0.1
        - -ip.bind=0.0.0.0
        - -s3.config=/etc/seaweedfs/s3.json
        ports:
        - containerPort: 8333
          name: s3
        # /healthz is served by the S3 server itself, which starts last, after the master,
        # volume and filer it depends on — so it is right for readiness as well.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8333
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8333
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.seaweedfs.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "nabat.fullname" . }}-seaweedfs
      - name: s3-config
        secret:
          secretName: {{ include "nabat.fullname" . }}-secrets
          items:
          - key: s3-config
            path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-seaweedfs
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/component: seaweedfs
  ports:
  - port: 8333
    targetPort: 8333
    name: s3
---
# Creates the bucket. Deliberately not the application's job: a service that creates its
# own bucket will just as happily create one from a typo and write into it, and the mistake
# only surfaces as photos that vanished.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nabat.fullname" . }}-seaweedfs-init
  namespace: {{ .Values.namespace }}
  annotations:
    # Runs on install and upgrade, after SeaweedFS exists. before-hook-creation lets a repeat
    # upgrade replace the previous Job, which is otherwise immutable and fails the release.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seaweedfs-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.seaweedfs.podSecurityContext | nindent 8 }}
      containers:
      - name: aws
        image: {{ .Values.seaweedfs.clientImage }}
        securityContext:
          {{- include "nabat.containerSecurityContext" . | nindent 10 }}
        env:
        # The CLI caches under $HOME, which the image sets to /root — not writable as uid 1000.
        - name: HOME
          value: /tmp
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://{{ include "nabat.fullname" . }}-seaweedfs:8333
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: s3-admin-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: s3-admin-secret-key
        command:
        - /bin/sh
        - -c
        - |
          # The Job may start before SeaweedFS is serving; retry rather than fail the release.
          until aws s3api head-bucket --bucket {{ .Values.nabatApp.storage.bucket }} 2>/dev/null \
              || aws s3 mb s3://{{ .Values.nabatApp.storage.bucket }}; do
            echo "waiting for seaweedfs..."
            sleep 3
          done
          echo "bucket {{ .Values.nabatApp.storage.bucket }} ready"
{{- end }}
{{- end }}
