apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nabat.fullname" . }}-voting-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
    app.kubernetes.io/component: voting-app
spec:
  replicas: {{ .Values.votingApp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: voting-app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: voting-app
        {{- include "nabat.labels" . | nindent 8 }}
    spec:
      {{- include "nabat.imagePullSecrets" . | nindent 6 }}
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z {{ include "nabat.fullname" . }}-voting-postgres 5432; do
            echo "waiting for voting postgres..."
            sleep 2
          done
      - name: wait-for-kafka
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z {{ include "nabat.fullname" . }}-kafka 9092; do
            echo "waiting for kafka..."
            sleep 2
          done
      containers:
      - name: voting-app
        image: {{ .Values.votingApp.image }}
        imagePullPolicy: {{ .Values.votingApp.imagePullPolicy }}
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://{{ include "nabat.fullname" . }}-voting-postgres:5432/{{ .Values.votingPostgres.database }}
        - name: SPRING_DATASOURCE_USERNAME
          value: {{ .Values.votingPostgres.user }}
        - name: SPRING_DATASOURCE_PASSWORD
          value: {{ .Values.votingPostgres.password }}
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: {{ include "nabat.fullname" . }}-kafka:9092
        - name: NABAT_SCHEMA_REGISTRY_URL
          value: http://{{ include "nabat.fullname" . }}-schema-registry:8085
        - name: SERVER_PORT
          value: "{{ .Values.votingApp.port }}"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: none
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "nabat.fullname" . }}-secrets
              key: jwt-secret
        ports:
        - containerPort: {{ .Values.votingApp.port }}
        resources:
          {{- toYaml .Values.votingApp.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.votingApp.port }}
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.votingApp.port }}
          initialDelaySeconds: 60
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nabat.fullname" . }}-voting-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nabat.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: voting-app
  ports:
  - port: {{ .Values.votingApp.port }}
