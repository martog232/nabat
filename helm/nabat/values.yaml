namespace: nabat

global:
  # REQUIRED, no default. Supply at install time so no signing key lives in git:
  #   helm install nabat ./helm/nabat --set global.jwtSecret="$(openssl rand -base64 48)"
  # Shared by nabat-app and nabat-voting — they must agree or cross-service JWT
  # validation fails. Templating fails fast when this is empty.
  jwtSecret: ""

postgres:
  image: postgis/postgis:16-3.4
  database: nabat_db
  user: nabat_user
  # REQUIRED, no default, same reasoning as global.jwtSecret. `nabat_password` used to be
  # committed here, which meant the `required` guard in templates/secret.yaml could never
  # fire — it read like the password was enforced while a known value shipped in git.
  password: ""
  storage: 1Gi

redis:
  image: redis:7-alpine

# The API gateway. Its routing, CORS and rate-limiting rules are not here — they live in
# kong/kong.yml at the chart root, which docker-compose mounts as well, so the two cannot
# drift. Disabling this sends the Ingress straight at the application, which is how the
# chart behaved before Kong was added: no gateway, and therefore no rate limiting.
kong:
  enabled: true
  image: kong:3.9
  replicas: 1
  proxyPort: 8000
  # /status and /metrics. Deliberately distinct from the Admin API on 8001, which is bound
  # to loopback: even in DB-less mode POST /config replaces the whole configuration.
  statusPort: 8100
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

nabatApp:
  # Fully qualified, so a cluster can actually pull it. This was a bare `nabat-app:latest`,
  # which only ever resolved to an image that happened to be present on a node — and CI never
  # pushed one anywhere, so on a clean cluster it never resolved at all. Deploy overrides the
  # tag with the commit SHA it published.
  image: ghcr.io/martog232/nabat-app:latest
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  # Left empty on purpose: the deployment template derives http://<ingress.host> so emailed
  # verification links match how a browser actually reaches the API. Set it only to override
  # that. It used to be hardcoded http://localhost:8080 even in-cluster, which made every
  # emailed link wrong and bypassed the gateway.
  baseUrl: ""
  votingServiceUrl: http://nabat-voting-app:8081
  mailHost: mailhog
  mailPort: 1025
  uploadsStorage: 100Mi
  resources:
    requests:
      cpu: 256m
      memory: 512Mi
    limits:
      cpu: 512m
      memory: 1Gi
  probes:
    startup:
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 15

votingPostgres:
  image: postgres:16
  database: nabat_voting_db
  user: nabat_voting_user
  # No committed default, for the same reason as postgres.password. Note the remaining flaw:
  # unlike the other two credentials this one is still injected as a plaintext env value in
  # voting-app.yaml and voting-postgres.yaml rather than read from the Secret, so it is
  # visible in `kubectl get deploy -o yaml`. Routing it through templates/secret.yaml like the
  # others is a small chart fix that has not been made yet.
  password: ""
  storage: 1Gi

kafka:
  image: apache/kafka:latest
  nodeId: "1"
  clusterId: "DWKW8vl4RI6tPZGCbhhHVg"

votingApp:
  # Pinned deliberately and changed on purpose. deploy.yml used to override this with
  # nabat-app's own commit SHA, which named no nabat-voting build that had ever existed. This
  # repository cannot know which voting build is current; pass `voting_image_tag` to
  # workflow_dispatch when a specific one is wanted.
  image: ghcr.io/martog232/nabat-voting-app:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 256m
      memory: 512Mi
    limits:
      cpu: 512m
      memory: 1Gi

ingress:
  host: nabat.local

monitoring:
  prometheus:
    image: prom/prometheus:latest
    storage: 2Gi
  grafana:
    image: grafana/grafana:latest
    adminPassword: admin
    storage: 1Gi
  loki:
    image: grafana/loki:latest
    storage: 2Gi
  promtail:
    image: grafana/promtail:latest
  zipkin:
    image: openzipkin/zipkin:latest
