namespace: nabat

# Names of docker-registry secrets in the target namespace, for pulling nabat-app and
# nabat-voting-app from GHCR.
#
# Empty is correct when the GHCR packages are public, which is the simpler choice: the images
# hold no credentials — JWT_SECRET and the database passwords arrive as environment variables
# from the Kubernetes Secret at runtime — so publishing them discloses only the compiled
# application. Packages pushed with GITHUB_TOKEN start out private, so this has to be a
# deliberate one-time change in each package's settings.
#
# To keep them private instead:
#   kubectl create namespace nabat
#   kubectl create secret docker-registry ghcr -n nabat \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password=<PAT with read:packages>
#   helm upgrade ... --set imagePullSecrets[0]=ghcr
# The namespace has to exist first: deploy.yml passes --create-namespace, so on a clean
# cluster Helm would otherwise create it and the secret could not already be inside.
imagePullSecrets: []

global:
  # REQUIRED, no default. Supply at install time so no signing key lives in git:
  #   helm install nabat ./helm/nabat --set global.jwtSecret="$(openssl rand -base64 48)"
  # Shared by nabat-app and nabat-voting — they must agree or cross-service JWT
  # validation fails. Templating fails fast when this is empty.
  jwtSecret: ""

postgres:
  image: postgis/postgis:16-3.4
  database: nabat_db
  user: nabat_user
  # REQUIRED, no default, same reasoning as global.jwtSecret. `nabat_password` used to be
  # committed here, which meant the `required` guard in templates/secret.yaml could never
  # fire — it read like the password was enforced while a known value shipped in git.
  password: ""
  storage: 1Gi

redis:
  image: redis:7-alpine

# The API gateway. Its routing, CORS and rate-limiting rules are not here — they live in
# kong/kong.yml at the chart root, which docker-compose mounts as well, so the two cannot
# drift. Disabling this sends the Ingress straight at the application, which is how the
# chart behaved before Kong was added: no gateway, and therefore no rate limiting.
kong:
  enabled: true
  image: kong:3.9
  replicas: 1
  proxyPort: 8000
  # /status and /metrics. Deliberately distinct from the Admin API on 8001, which is bound
  # to loopback: even in DB-less mode POST /config replaces the whole configuration.
  statusPort: 8100
  # Kong starts one nginx worker per CPU core by default, each with its own Lua VM and a
  # copy of the cached declarative config. On a 4-core node that overshot a 512Mi limit and
  # the container was OOMKilled into CrashLoopBackOff — 137, not a configuration error, and
  # invisible until the chart was actually installed. Pinning the worker count makes memory
  # a property of this file rather than of whatever node it lands on.
  workerProcesses: "2"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  probes:
    # Explicit, because the 1s default is tight for Kong: /status does real work, and under
    # memory pressure the probe timed out and the liveness kill masked the OOM as a probe
    # failure.
    timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 15
      failureThreshold: 3

nabatApp:
  # Fully qualified, so a cluster can actually pull it. This was a bare `nabat-app:latest`,
  # which only ever resolved to an image that happened to be present on a node — and CI never
  # pushed one anywhere, so on a clean cluster it never resolved at all. Deploy overrides the
  # tag with the commit SHA it published.
  image: ghcr.io/martog232/nabat-app:latest
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  # Left empty on purpose: the deployment template derives http://<ingress.host> so emailed
  # verification links match how a browser actually reaches the API. Set it only to override
  # that. It used to be hardcoded http://localhost:8080 even in-cluster, which made every
  # emailed link wrong and bypassed the gateway.
  baseUrl: ""
  votingServiceUrl: http://nabat-voting-app:8081
  mailHost: mailhog
  mailPort: 1025
  # Boot 3.4's built-in ECS formatter. Set to "" to fall back to the human-readable
  # pattern — worth doing when tailing a single pod by hand, since JSON is far harder to
  # read than it is to query.
  logFormat: ecs
  environment: kubernetes
  uploadsStorage: 100Mi
  resources:
    requests:
      cpu: 256m
      memory: 512Mi
    limits:
      cpu: 512m
      memory: 1Gi
  probes:
    # Generous: the startup probe holds the other two off until it first succeeds, so this
    # is the budget for JVM start plus Flyway. 30 x 5s = 150s before the pod is given up on.
    startup:
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 15
    # Tighter than liveness on purpose. Being wrong about readiness costs one pod's share
    # of traffic for a few seconds; being wrong about liveness costs a restart.
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 3

votingPostgres:
  image: postgres:16
  database: nabat_voting_db
  user: nabat_voting_user
  # No committed default, for the same reason as postgres.password. Note the remaining flaw:
  # unlike the other two credentials this one is still injected as a plaintext env value in
  # voting-app.yaml and voting-postgres.yaml rather than read from the Secret, so it is
  # visible in `kubectl get deploy -o yaml`. Routing it through templates/secret.yaml like the
  # others is a small chart fix that has not been made yet.
  password: ""
  storage: 1Gi

kafka:
  image: apache/kafka:latest
  nodeId: "1"
  clusterId: "DWKW8vl4RI6tPZGCbhhHVg"

votingApp:
  # Pinned deliberately and changed on purpose. deploy.yml used to override this with
  # nabat-app's own commit SHA, which named no nabat-voting build that had ever existed. This
  # repository cannot know which voting build is current; pass `voting_image_tag` to
  # workflow_dispatch when a specific one is wanted.
  image: ghcr.io/martog232/nabat-voting-app:latest
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 256m
      memory: 512Mi
    limits:
      cpu: 512m
      memory: 1Gi

ingress:
  host: nabat.local

monitoring:
  prometheus:
    image: prom/prometheus:latest
    storage: 2Gi
  grafana:
    image: grafana/grafana:latest
    adminPassword: admin
    storage: 1Gi
  loki:
    image: grafana/loki:latest
    storage: 2Gi
  promtail:
    image: grafana/promtail:latest
  zipkin:
    image: openzipkin/zipkin:latest
