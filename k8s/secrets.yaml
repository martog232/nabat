# This Secret intentionally contains NO jwt-secret value.
#
# A committed signing key is a publicly-known signing key: anyone with repo access
# could forge an admin token for any cluster these manifests were applied to.
# Create it out-of-band instead, before applying the rest of the manifests:
#
#   kubectl -n nabat create secret generic nabat-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)"
#
# nabat-app and nabat-voting must both read the SAME key, otherwise tokens minted
# by nabat-app will not validate in nabat-voting.
#
# To keep the Secret declarative, manage it with sealed-secrets / external-secrets /
# SOPS rather than plaintext in git.
#
# Applying this file as-is creates an empty Secret; nabat-app then refuses to start
# with an explicit error, which is the intended fail-closed behaviour.
apiVersion: v1
kind: Secret
metadata:
  name: nabat-secrets
  namespace: nabat
type: Opaque
stringData: {}
