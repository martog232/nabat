apiVersion: apps/v1
kind: Deployment
metadata:
  name: nabat-app
  namespace: nabat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nabat-app
  template:
    metadata:
      labels:
        app: nabat-app
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "waiting for postgres..."
            sleep 2
          done
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "waiting for redis..."
            sleep 2
          done
      containers:
      - name: nabat-app
        image: nabat-app:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/nabat_db
        - name: SPRING_DATASOURCE_USERNAME
          value: nabat_user
        - name: SPRING_DATASOURCE_PASSWORD
          value: nabat_password
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: nabat-secrets
              key: jwt-secret
        - name: MAIL_HOST
          value: mailhog
        - name: MAIL_PORT
          value: "1025"
        - name: NABAT_BASE_URL
          value: http://localhost:8080
        - name: NABAT_VOTING_SERVICE_BASE_URL
          value: http://nabat-voting-app:8081
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /app/uploads
          name: uploads-storage
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: nabat-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: nabat-app
  namespace: nabat
spec:
  selector:
    app: nabat-app
  ports:
  - port: 8080
  type: NodePort
