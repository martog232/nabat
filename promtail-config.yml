server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # /run, where a named volume is mounted, so a restart resumes where it stopped instead
  # of re-shipping every log still on disk. The container's own /tmp does not survive.
  filename: /run/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_prometheus_job]
        target_label: job
    pipeline_stages:
      # The application emits ECS JSON (NABAT_LOG_FORMAT=ecs). Without this stage Loki
      # stores each line as an opaque string, so traceId is only findable by substring
      # search — which defeats the point of logging JSON in the first place.
      #
      # Non-JSON lines (Postgres, Redis, Kong, and the app's own pre-formatter startup
      # output) simply do not match and pass through unchanged.
      - json:
          expressions:
            # Unquoted, because these are JMESPath expressions and Boot 4 emits ECS as
            # nested objects: log.level reads the "level" field of the "log" object. Boot 3.4
            # emitted a single flat key literally named "log.level", which JMESPath only
            # reaches when quoted — so the quoting that used to be required is now what breaks
            # it. Getting this wrong does not fail: Promtail ships the lines with no level and
            # no traceId label, and Loki looks like a system nobody is logging in.
            level: log.level
            logger: log.logger
            traceId: traceId
            service: service.name
            ts: '"@timestamp"'
      # A label, not just a field: `level` has a handful of values, so indexing it makes
      # "show me the errors" a stream selector and costs almost nothing.
      #
      # traceId is deliberately NOT a label. Loki indexes label values into separate
      # streams, and a trace id is unique per request — promoting it meant one stream per
      # request, and an ordinary hour-long query over this stack already answered
      # "maximum number of series (500) reached for a single query" instead of logs. The
      # search it was added for still works, through the field the json stage extracts:
      #
      #     {service="nabat-app"} | json | traceId = "<id>"
      #
      # That reads the line rather than the index, which is the intended shape for a
      # high-cardinality value — Loki 3 calls the indexed-but-not-a-stream version of
      # this structured metadata, if it is ever worth the upgrade.
      - labels:
          level:
      # Use the application's own timestamp rather than ingestion time, so ordering
      # survives a shipping delay.
      # `source` names a field extracted by the json stage above, not a JMESPath
      # expression — hence `ts` rather than "@timestamp".
      - timestamp:
          source: ts
          format: RFC3339Nano
          action_on_failure: skip
