# Single runtime configuration
spring.application.name=nabat

# PostgreSQL
# Use 127.0.0.1 instead of localhost to avoid Windows IPv6 localhost conflicts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/nabat_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nabat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nabat_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Flyway handles schema and seed data
spring.sql.init.mode=never

# Event Publication Registry (see V11 and NewAlertFanout)
# Replay on startup is the whole point of the registry: without it the outstanding rows
# accumulate and are never handled, which is strictly worse than not recording them.
spring.modulith.events.republish-outstanding-events-on-restart=true
# `update` stamps completion_date and keeps the row, rather than deleting it. Kept for
# now because being able to query what was published, and whether it completed, is worth
# more here than a small table; revisit if the row count ever matters.
spring.modulith.events.completion-mode=update

# Server
server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
# Mail is an optional outbound integration — exclude it from the liveness/readiness aggregate
# so that a missing SMTP relay (e.g. no MailHog locally) does not mark the app as DOWN.
# The mail health sub-indicator is still visible at /actuator/health when show-details=always.
management.health.mail.enabled=false

# Metrics — tag every meter with the application name for Prometheus grouping
management.metrics.tags.application=${spring.application.name}

# Tracing — sample 100 % in dev; reduce in production via environment variable
management.tracing.sampling.probability=${NABAT_TRACING_SAMPLING_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://nabat-zipkin:9411/api/v2/spans}

# JWT
# No default: the app refuses to start without a real JWT_SECRET (see JwtTokenProvider).
# A committed fallback would mean every deployment that forgot to override it signs
# tokens with a key that is public in version control.
# Generate one with: openssl rand -base64 48
# nabat-app and nabat-voting MUST share the same value.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.org.example.nabat=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) [${spring.application.name},%X{traceId:-},%X{spanId:-}] [%t] %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# Structured (JSON) logging — Boot 3.4's built-in ECS formatter, no extra encoder needed.
# Empty by default so local runs keep the human-readable pattern above; deployments set
# NABAT_LOG_FORMAT=ecs (see docker-compose.yml and the Helm chart) so Promtail has JSON to
# parse and trace.id becomes a queryable field in Grafana rather than text inside a line.
# Setting this makes logging.pattern.console inert — the formatter replaces the layout.
logging.structured.format.console=${NABAT_LOG_FORMAT:}
# service.name is deliberately not set here: the ECS formatter already falls back to
# spring.application.name, and setting it to ${spring.application.name} resolved to an
# empty string — the logging system is configured before that placeholder can be resolved,
# so the explicit property beat the working fallback and produced a nameless service.
logging.structured.ecs.service.environment=${NABAT_ENVIRONMENT:local}
# Known deviation from ECS: tracing arrives as `traceId`/`spanId`, not the ECS-canonical
# `trace.id`/`span.id`. The formatter copies MDC keys through verbatim, and
# `logging.structured.json.rename.*` does not reach them — MDC is emitted as dynamic pairs
# rather than named members, so the rename applies cleanly and changes nothing. Left as-is
# because the consumer here is Loki, which cares that the field exists and is queryable,
# not that it is named to Elastic's schema. Query `traceId`, not `trace.id`.

# Structured request/response logging. Set to true to enable per-request log lines.
logging.nabat.request-log=${NABAT_REQUEST_LOG:true}

# CORS — comma-separated origins/patterns allowed for HTTP and WebSocket.
# Empty by default → no cross-origin requests permitted. Example for dev:
#   NABAT_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
nabat.cors.allowed-origins=${NABAT_CORS_ALLOWED_ORIGINS:}

# WebSocket auth — browser clients should exchange their access token for a short-lived one-time ticket.
# Tickets are stored in Redis so they can be redeemed by whichever replica handles the upgrade.
nabat.websocket.ticket-ttl=${NABAT_WEBSOCKET_TICKET_TTL:PT2M}
# How long a single frame may take to flush before the session is closed as too slow.
nabat.websocket.send-time-limit-ms=${NABAT_WEBSOCKET_SEND_TIME_LIMIT_MS:5000}

# Mail (SMTP) — points at MailHog in local dev, override in production
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Redis (shared across instances)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Cache — nearby alerts TTL (seconds)
nabat.cache.nearby-ttl=${NABAT_CACHE_NEARBY_TTL:15}

# Rate limiting is enforced at the Kong API-gateway layer (separate repository).
# LoginAttemptTracker here only observes and logs; it does not block.

# File upload / photo storage
spring.servlet.multipart.max-file-size=${NABAT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${NABAT_MAX_REQUEST_SIZE:15MB}
nabat.storage.upload-dir=${NABAT_UPLOAD_DIR:./uploads}
nabat.storage.serve-path=/api/v1/uploads/
# Enforced by the storage adapter itself as well as by the multipart limits above,
# since a declared content length can lie.
nabat.storage.max-file-size-bytes=${NABAT_MAX_FILE_SIZE_BYTES:10485760}

# Nabat mail settings
nabat.mail.from=${MAIL_FROM:noreply@nabat.local}
# Base URL used in email links — override in production
nabat.mail.base-url=${NABAT_BASE_URL:http://localhost:8080}

# External voting service integration
nabat.voting.service.base-url=${NABAT_VOTING_SERVICE_BASE_URL:http://localhost:8081}
nabat.voting.service.auth-token=${NABAT_VOTING_SERVICE_AUTH_TOKEN:}
nabat.voting.service.connect-timeout=${NABAT_VOTING_SERVICE_CONNECT_TIMEOUT:PT2S}
nabat.voting.service.read-timeout=${NABAT_VOTING_SERVICE_READ_TIMEOUT:PT3S}
