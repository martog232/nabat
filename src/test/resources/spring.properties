# How many Spring contexts the test framework keeps alive at once. Default is 32.
#
# The suite has around fifteen distinct contexts. Keeping every one of them alive is what
# removing @DirtiesContext from PostgresTestSupport actually did — and with each holding a
# connection pool, a Redis client and its own beans, the run collapsed: twenty-six tests failed
# with "Could not open JPA EntityManager", every one of them a connection that could not be
# acquired.
#
# Four is enough for reuse to pay off — consecutive test classes usually share a configuration
# — while bounding what is held open at any moment. Discarding a context is cheap; failing to
# open a database connection is not.
spring.test.context.cache.maxSize=4
