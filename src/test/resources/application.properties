# Test-only overrides (no Spring profile required)
spring.application.name=nabat-test

# ── Database ──────────────────────────────────────────────────────────────────
# All tests that touch the database extend PostgresTestSupport, which injects
# the real PostgreSQL (postgis/postgis:16-3.4) Testcontainers URL at runtime via
# @DynamicPropertySource.  The placeholder below is intentionally pointing at a
# non-routable address so that any misconfigured test context fails fast instead
# of silently connecting to a developer's local database.
spring.datasource.url=jdbc:postgresql://localhost:0/nabat_test_no_container_configured
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=nabat
spring.datasource.password=nabat

# JPA / Hibernate — schema must come from Flyway; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — enabled by default; PostgresTestSupport also sets this via @DynamicPropertySource.
spring.flyway.enabled=true

# JWT
jwt.secret=test-jwt-secret-key-for-testing-only-min-256-bits-required-do-not-use-in-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server / actuator
server.port=0
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Liveness/readiness groups — a REPEAT of src/main/resources/application.properties, for
# the replacement reason documented below. Keep the two in step: HealthProbesIntegrationTest
# asserts the group membership, but it can only see the values in *this* file, so a change
# made only in the main file would leave the test passing while production drifts.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=never

# Logging
logging.level.org.example.nabat=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN

# ── Photo storage ─────────────────────────────────────────────────────────────
# Required, not optional. FileSystemStorageAdapter declares @Value("${nabat.storage.upload-dir}")
# and @Value("${nabat.storage.serve-path}") with no inline defaults, so without these the bean
# cannot be created and *the entire application context fails to load* — taking every
# @SpringBootTest with it.
#
# The trap: this file does not merge with src/main/resources/application.properties, it
# replaces it. Both are classpath:/application.properties and test-classes comes first, so
# every property the main file defines is invisible here unless repeated. That is why the
# defaults in the main file (${NABAT_UPLOAD_DIR:./uploads}) do not help.
#
# This went unnoticed for a long time because the tests that load the context are all
# Testcontainers-based and skip without Docker, so a developer machine reports them as
# "skipped" rather than failed.
#
# Written under the JVM temp directory so tests never create files inside the working tree.
nabat.storage.upload-dir=${java.io.tmpdir}/nabat-test-uploads
nabat.storage.serve-path=/api/v1/uploads/

# Mail — point at a non-existent server; tests mock EmailSender so no real connection is made
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
nabat.mail.from=noreply@nabat.test
nabat.mail.base-url=http://localhost

# Kafka. This file shadows the main application.properties rather than adding to it, so the
# consumer's settings have to be repeated here or the listener cannot resolve them.
#
# Off for every test but the one that asks for it: a listener in a context with no broker
# would spend the suite retrying a connection.
nabat.kafka.enabled=false
# @EmbeddedKafka supplies spring.kafka.bootstrap-servers where a broker is wanted.
spring.kafka.consumer.group-id=nabat-app-test-group
spring.kafka.consumer.auto-offset-reset=earliest
# An in-memory registry, addressed by scope rather than by host. Confluent's serialisers
# recognise the mock:// scheme and share one registry per scope inside the JVM, so a test can
# write a message the application context can read without a registry container.
nabat.schema-registry.url=mock://nabat-app-tests
