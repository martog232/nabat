# Prometheus scrape configuration for the local compose stack.
#
# The previous version used docker_sd_configs and kept only containers labelled
# `prometheus.enable=true`. No service in docker-compose.yml declared that label, and
# /var/run/docker.sock was never mounted into this container, so it discovered nothing and
# scraped nothing — while looking like a working configuration. Static targets are less
# elegant but they are verifiable by reading them.
#
# Note what the two Spring services serve: Micrometer is exposed at /actuator/prometheus,
# not /metrics. Omitting metrics_path is why the Helm chart's Prometheus 404s on every
# scrape.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Where firing alerts go. Rules without an Alertmanager are visible only in the Alerts tab
# of a UI nobody has open, which is monitoring, not alerting.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Shared with the Helm chart — see the header of the file itself for why it lives there.
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Gateway metrics from the status listener, not the Admin API on 8001. The prometheus
  # plugin serves /metrics on both; only one of them is also a control surface capable of
  # replacing Kong's entire configuration.
  - job_name: 'kong-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['kong:8100']
        labels:
          component: gateway

  # nabat-app. Includes `nabat_usecase_duration_*`, the one piece of bespoke instrumentation
  # in the codebase (UseCaseMetricsAspect times every @UseCase method with a success/error
  # outcome tag). Nothing collected it before this file changed.
  - job_name: 'nabat-app'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nabat-app:8080']
        labels:
          component: nabat-app

  # nabat-voting now runs in this stack, behind the `voting` compose profile, so this target
  # resolves and goes UP with `docker compose --profile voting up`. It previously lived only
  # in its own compose stack on its own network and could never resolve from here.
  #
  # Without the profile it shows DOWN, which is correct rather than untidy: the service is
  # genuinely absent and every vote is answering 503. A target quietly removed when the
  # profile is off would hide exactly the fact worth seeing. `VotingServiceUnreachable` in
  # prometheus/rules.yml is a warning rather than a critical for the same reason.
  - job_name: 'nabat-voting'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['nabat-voting-app:8081']
        labels:
          component: nabat-voting
