services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nabat-postgres
    environment:
      POSTGRES_DB: nabat_db
      POSTGRES_USER: nabat_user
      POSTGRES_PASSWORD: nabat_password
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabat_user -d nabat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Required, not optional: WebSocket ticket redemption and the nearby-alerts cache both go
  # through Redis. This stack omitted it, so `docker compose up` produced an app that could
  # not issue a WebSocket ticket — the browser's only way to open the realtime connection.
  redis:
    image: redis:7-alpine
    container_name: nabat-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nabat-mailhog
    ports:
      - "1025:1025"   # SMTP — Spring Boot sends mail here
      - "8025:8025"   # Web UI — open http://localhost:8025 to browse emails
    restart: unless-stopped

  # Object storage for alert photos. Present so the compose stack exercises the same code
  # path a cluster does: local disk works for one container and quietly breaks the moment
  # there are two replicas without a shared volume.
  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: nabat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nabat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nabat-dev-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console — http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO does not create buckets on startup, and the application deliberately does not
  # create one either — a service that makes its own bucket will happily make one from a
  # typo and write into it. One-shot job instead, so the bucket is a property of the stack.
  minio-init:
    # Re-pinned: RELEASE.2024-08-26T22-27-06Z no longer exists on Docker Hub, and MinIO
    # prunes old `mc` tags, so `docker compose up` failed for everyone with an image that
    # could not be resolved. Still pinned rather than `latest` — a one-shot job that
    # creates the bucket every other service depends on is the last place to want a
    # silently changing image — but the pin needs refreshing when it disappears again.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: nabat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-nabat} $${MINIO_ROOT_PASSWORD:-nabat-dev-secret} &&
      mc mb --ignore-existing local/nabat-uploads &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nabat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nabat-dev-secret}

  nabat-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nabat-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for the bucket to exist, not just for MinIO to answer. Starting before the
      # init job finishes means the first upload fails against a bucket that is moments
      # away from being created.
      minio-init:
        condition: service_completed_successfully
      # Ordering only, no condition: the span exporter buffers and retries, so a late
      # Zipkin costs nothing but a page of resolution warnings during startup.
      zipkin:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nabat_db
      SPRING_DATASOURCE_USERNAME: nabat_user
      SPRING_DATASOURCE_PASSWORD: nabat_password
      SPRING_DATA_REDIS_HOST: redis
      # Required — compose fails fast if unset rather than falling back to a committed key.
      # Generate one with `openssl rand -base64 48` and put it in .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Generate one with `openssl rand -base64 48` and set it in .env}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      # Through the gateway, so emailed verification links match how a browser reaches the
      # API. Pointing at :8080 bypassed Kong and therefore its CORS and rate limits.
      NABAT_BASE_URL: http://localhost:8000
      # JSON logs, so Promtail ships fields rather than text and traceId is queryable in
      # Grafana. Unset outside containers, where the human-readable pattern is better.
      NABAT_LOG_FORMAT: ecs
      NABAT_ENVIRONMENT: compose
      # Stated explicitly, by compose service name. The application's default happens to
      # be `nabat-zipkin`, which resolves here only because the zipkin service also
      # carries that container_name — a coincidence to depend on for tracing.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Reclaim photos whose alert was never submitted. Off by default in the application;
      # switched on here because this stack owns a volume that would otherwise only grow.
      NABAT_ORPHAN_SWEEP_ENABLED: "true"
      # Object storage rather than the container's own disk, so compose runs the same
      # storage path a multi-replica deployment does.
      NABAT_STORAGE_TYPE: s3
      NABAT_S3_ENDPOINT: http://minio:9000
      NABAT_S3_BUCKET: nabat-uploads
      NABAT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nabat}
      NABAT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-nabat-dev-secret}
      # Stated because the application default is http://localhost:8081, which inside this
      # container is this container. Set whether or not the voting profile is running: with
      # it, votes work; without it, they fail as 503 against a name that does not resolve,
      # which is the same answer the code gives for a voting service that is down.
      NABAT_VOTING_SERVICE_BASE_URL: http://nabat-voting-app:8081
      # The vote counts on `alerts` are written by a consumer of nabat-voting's vote events,
      # so this belongs on whenever the voting profile is:
      #
      #     NABAT_KAFKA_ENABLED=true docker compose --profile voting up -d
      #
      # It is not simply "true", because the broker only exists under that profile and a
      # listener without one logs a connection warning every second forever. Compose cannot
      # ask which profiles are active, so this is the one thing the profile does not carry
      # by itself.
      NABAT_KAFKA_ENABLED: ${NABAT_KAFKA_ENABLED:-false}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NABAT_SCHEMA_REGISTRY_URL: http://schema-registry:8085
    ports:
      # Published for direct access during development and for Prometheus. Browser traffic
      # should go through Kong on :8000 so local behaviour matches deployed behaviour.
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - nabat_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # The gateway. DB-less: kong/kong.yml is the entire configuration, so a routing or
  # rate-limit change is a reviewable commit rather than an Admin API call on one machine.
  kong:
    image: kong:3.9
    container_name: nabat-kong
    depends_on:
      nabat-app:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Loopback only. The Admin API is a control surface even in DB-less mode, where
      # `POST /config` replaces the whole configuration — anything that can reach it owns
      # the gateway. Reach it with `docker exec` when you genuinely need it.
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      # Status listener: /status and, with the prometheus plugin, /metrics. This is what
      # Prometheus scrapes. Scraping the Admin API port for metrics works but exposes the
      # control surface to do it.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      # The canonical config, shared with the Helm chart rather than copied. It lives under
      # the chart because Helm's .Files.Get cannot read outside a chart directory, and one
      # file that both environments load is worth more than a tidier path plus drift.
      - ./helm/nabat/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"   # proxy — the address browsers and the frontend should use
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nabat-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # The rules live under the chart because Helm's .Files.Get cannot read outside it,
      # and one file loaded by both environments beats two that drift apart.
      - ./helm/nabat/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - nabat-app
      - kong
      - alertmanager
    restart: unless-stopped

  # Turns firing rules into a notification. Without it Prometheus evaluates rules and the
  # result is visible only to whoever thinks to open the Alerts tab — which is not alerting.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nabat-alertmanager
    volumes:
      - ./helm/nabat/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    # Delivery target: alerts are emailed to MailHog, where they are actually readable.
    depends_on:
      - mailhog
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nabat-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      # Dashboards as code. The provider and the JSON live under the chart so both
      # environments load the same files — only the datasource URLs differ per
      # environment, which is why datasources stay outside.
      - ./helm/nabat/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/nabat.yml:ro
      - ./helm/nabat/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    # All three datasources, not just Prometheus. Grafana was provisioned with Loki and
    # Zipkin datasources while neither service existed in this file, so two of the three
    # panels a developer would open were dead on arrival.
    depends_on:
      - prometheus
      - loki
      - zipkin
    restart: unless-stopped

  # Log aggregation. The single-binary image ships a working config at
  # /etc/loki/local-config.yaml; anything more is a distributed-mode concern this stack
  # does not have.
  loki:
    image: grafana/loki:latest
    container_name: nabat-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      # Published like Prometheus and Zipkin, so `curl localhost:3100/loki/api/v1/labels`
      # can answer "did any log actually arrive" without going through Grafana. Grafana
      # itself talks to it over the compose network.
      - "3100:3100"
    restart: unless-stopped

  # Ships container logs into Loki. `promtail-config.yml` existed in this repository and
  # was referenced by nothing — the parsing it describes (ECS JSON into fields, traceId
  # as a label) simply never ran anywhere.
  promtail:
    image: grafana/promtail:latest
    container_name: nabat-promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail.yml:ro
      # Docker service discovery reads the container list and log streams from the daemon.
      # Read-only: the socket is root on the host, and a writable mount is a container
      # escape, not a log shipper.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Named volume so a promtail restart resumes where it stopped instead of re-shipping
      # every log it can still see.
      - promtail_positions:/run
    depends_on:
      - loki
    restart: unless-stopped

  # ── The voting service, opt-in ────────────────────────────────────────────────
  #
  # `docker compose up` leaves these out; `docker compose --profile voting up` includes
  # them. Kafka plus a second Postgres plus a second JVM is a lot to ask of a laptop that
  # is already running twelve containers, and most work here does not touch voting.
  #
  # Without the profile, every vote answers 503: V7 dropped the local alert_votes table, so
  # nabat-voting is the only path there is. That is the honest failure — the endpoint says
  # the dependency is unavailable rather than pretending the feature does not exist.
  #
  # These are an *alternative* to running nabat-voting's own compose file, not a companion
  # to it. Both bind 8081 and both name a container nabat-voting-app, so starting both at
  # once fails loudly, which is the intended outcome.
  kafka:
    profiles: [voting]
    image: apache/kafka:latest
    container_name: nabat-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners, and this is not incidental: nabat-voting's own compose file records
      # what happens with one. Advertising only PLAINTEXT://localhost:9092 lets the
      # bootstrap connection succeed, after which the broker hands back localhost:9092 as
      # the partition leader's address — which, resolved inside the app container, is the
      # app itself. Every produce and fetch then fails, with a healthy-looking broker.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # All three internal topics have to be single-replica on a one-broker cluster, or
      # their creation fails and takes consumer-group coordination down with it.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: DWKW8vl4RI6tPZGCbhhHVg
    ports:
      # Host tooling (a console consumer, say) uses the EXTERNAL listener; containers on
      # this network reach kafka:9092 directly.
      - "29092:29092"
    # No volume, deliberately: the topics are recreated on start and the broker holds
    # nothing this stack cannot rebuild. Mounting one would mean guessing the image's log
    # directory, and a named volume at the wrong path is an empty directory that looks
    # mounted.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Holds the Avro schema for vote.changed and refuses a version that would break the
  # consumers already reading it. Part of the profile rather than the default stack because
  # it is only useful alongside Kafka — but within the profile it is not optional: a vote
  # cannot be serialised without a schema id, and an id cannot be resolved without this.
  schema-registry:
    profiles: [voting]
    image: confluentinc/cp-schema-registry:8.0.0
    container_name: nabat-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      # The registry keeps its schemas in a Kafka topic, single-replica like everything else
      # on a one-broker cluster.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
      # BACKWARD: a new schema must read data written with the old one. That is the direction
      # this system needs, because nabat-app replays the topic from the start to rebuild its
      # counts and therefore meets old messages by design.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    restart: unless-stopped

  # Its own database, not a second schema in nabat-app's. Owning its data is most of the
  # reason the service exists; a shared database would make this a distributed monolith,
  # which is the first entry in the anti-pattern table in TARGET_ARCHITECTURE.md.
  voting-postgres:
    profiles: [voting]
    image: postgres:16
    container_name: nabat-voting-postgres
    environment:
      POSTGRES_DB: nabat_voting_db
      POSTGRES_USER: nabat_voting_user
      POSTGRES_PASSWORD: nabat_voting_password
    ports:
      # 5434: nabat-app's Postgres is on 5433, a locally installed one is usually on 5432.
      - "${VOTING_POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - voting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabat_voting_user -d nabat_voting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nabat-voting-app:
    profiles: [voting]
    # Consumed as a published artifact, exactly as the Helm chart consumes it — this file
    # does not build another repository's source. Override with NABAT_VOTING_IMAGE to pin a
    # tag, or point it at a locally built image when working on that service. If the pull
    # fails with "denied", the GHCR package is still private: `docker login ghcr.io`, or
    # make the package public.
    #
    # NOTE (2026-08-26): the currently published `latest` predates a fix in nabat-voting and
    # crash-loops against an empty database — it lacks spring-boot-flyway, so Boot 4 runs no
    # migrations and ddl-auto=validate then fails on the missing alert_credibility table.
    # Until CI republishes, build it and point this at the result:
    #     (cd ../nabat-voting && docker build -t nabat-voting-app:local .)
    #     NABAT_VOTING_IMAGE=nabat-voting-app:local docker compose --profile voting up -d
    image: ${NABAT_VOTING_IMAGE:-ghcr.io/martog232/nabat-voting-app:latest}
    container_name: nabat-voting-app
    depends_on:
      voting-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://voting-postgres:5432/nabat_voting_db
      SPRING_DATASOURCE_USERNAME: nabat_voting_user
      SPRING_DATASOURCE_PASSWORD: nabat_voting_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NABAT_SCHEMA_REGISTRY_URL: http://schema-registry:8085
      SERVER_PORT: 8081
      # The same value nabat-app signs with. nabat-voting verifies the caller's forwarded
      # access token and derives the voter from its userId claim, so a different secret
      # turns every vote into a 401 there and a 503 here — the shared-secret weakness and
      # the reason it currently has to be shared, both in one line.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must match nabat-app. Generate with `openssl rand -base64 48` and set it in .env}
    ports:
      - "8081:8081"
    restart: unless-stopped

  # Tracing backend. The application has always been configured to send spans here
  # (`ZIPKIN_ENDPOINT`, defaulting to this host name), but the service was missing from
  # this file, so every export failed DNS resolution and no trace was ever viewable.
  #
  # STORAGE_TYPE is stated rather than left to the default: `mem` is a ring buffer that
  # dies with the container. That is right for local work and wrong for anything else, so
  # it should be visible rather than implied.
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: nabat-zipkin
    environment:
      STORAGE_TYPE: mem
    ports:
      - "9411:9411"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  voting_postgres_data:
    driver: local
  # Silences and notification state. Without it every restart re-notifies everything that
  # is still firing, and any silence a person set is gone.
  alertmanager_data:
    driver: local
  promtail_positions:
    driver: local
  # Retained: NABAT_STORAGE_TYPE can be set back to `filesystem` and the app still has
  # somewhere to write.
  nabat_uploads:
    driver: local
  minio_data:
    driver: local

